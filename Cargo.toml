[workspace]
members = [
  "crates/core_bindings",
  "crates/event_codec_wasm",
  "crates/event_bindings",
  "crates/event_index_bindings",
  "crates/identity_bindings",
  "crates/replica_store_wasm",
  "crates/replica_schema_bindings",
  "crates/replica_sync_wasm",
  "crates/runtime_contract_v1",
  "crates/radroots",
  "crates/sdk",
  "crates/sql_wasm_runtime",
  "crates/trade_bindings",
  "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/radrootslabs/sdk"
homepage = "https://radroots.org"
readme = "README"
authors = ["Tyson Lupul <tyson@radroots.org>"]

[workspace.metadata.radroots.public-package]
version = "0.1.0-alpha"
authors = ["Tyson Lupul <tyson@radroots.org>"]
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
dto_bindgen = { version = "0.1.0" }
dto_bindgen_backend_ts = { version = "0.1.0" }
dto_bindgen_core = { version = "0.1.0" }
radroots_authority = { version = "=0.1.0-alpha", default-features = false }
radroots_blossom = { package = "radroots_blossom", version = "=0.1.0-alpha", default-features = false }
radroots_core = { package = "radroots_core", version = "=0.1.0-alpha", default-features = false }
radroots_event_store = { version = "=0.1.0-alpha", default-features = false }
radroots_event = { package = "radroots_event", version = "=0.1.0-alpha", default-features = false }
radroots_event_codec = { package = "radroots_event_codec", version = "=0.1.0-alpha", default-features = false }
radroots_event_index = { version = "=0.1.0-alpha", default-features = false }
radroots_geocoder = { version = "=0.1.0-alpha" }
radroots_identity = { package = "radroots_identity", version = "=0.1.0-alpha", default-features = false, features = [
  "std",
] }
radroots_nostr = { package = "radroots_nostr", version = "=0.1.0-alpha", default-features = false }
radroots_nostr_connect = { package = "radroots_nostr_connect", version = "=0.1.0-alpha", default-features = false }
radroots_nostr_signer = { version = "=0.1.0-alpha", default-features = false }
radroots_outbox = { version = "=0.1.0-alpha", default-features = false }
radroots_protocol = { version = "=0.1.0-alpha", default-features = false }
radroots_protocol_contract_v1 = { version = "=0.1.0-alpha", default-features = false }
radroots_protected_store = { version = "=0.1.0-alpha", default-features = false }
radroots_runtime_contract_v1 = { path = "crates/runtime_contract_v1", version = "=0.1.0-alpha", default-features = false }
radroots_secret_vault = { version = "=0.1.0-alpha", default-features = false }
radroots_transport = { package = "radroots_transport", version = "=0.1.0-alpha", default-features = false }
radroots_transport_nostr = { package = "radroots_transport_nostr", version = "=0.1.0-alpha", default-features = false }
radroots_transport_reticulum = { version = "=0.1.0-alpha", default-features = false }
radroots_replica_store = { version = "=0.1.0-alpha", default-features = false }
radroots_replica_schema = { version = "=0.1.0-alpha", default-features = false }
radroots_replica_sync = { version = "=0.1.0-alpha", default-features = false }
radroots_runtime_paths = { version = "=0.1.0-alpha", default-features = false }
radroots_sdk_sql_wasm_runtime = { path = "crates/sql_wasm_runtime", version = "=0.1.0-alpha" }
radroots_sql_core = { version = "=0.1.0-alpha", default-features = false }
radroots_trade = { package = "radroots_trade", version = "=0.1.0-alpha", default-features = false, features = [
  "serde_json",
  "std",
] }

base64 = { version = "0.22", default-features = false, features = ["alloc"] }
futures = { version = "0.3" }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
js-sys = { version = "0.3" }
nostr = { version = "0.44.2" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde-wasm-bindgen = { version = "0.6" }
sha2 = { version = "0.10", default-features = false }
sqlx = { version = "0.9.0", default-features = false }
tempfile = { version = "3" }
tokio = { version = "1" }
tokio-tungstenite = "0.26.2"
uuid = { version = "1.22.0", features = ["v4", "v7"] }
wasm-bindgen = { version = "0.2" }
wasm-bindgen-test = { version = "0.3" }
