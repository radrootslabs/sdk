[alias]
xtask = "run -p radroots_sdk_xtask --"

# Migration-only local development overrides. Release manifests contain only
# registry identities; package-realistic checks run extracted crates without
# this repository configuration.
[patch.crates-io]
radroots_authority = { path = "../lib/crates/authority" }
radroots_blossom = { path = "../lib/crates/blossom" }
radroots_core = { path = "../lib/crates/core" }
radroots_event_store = { path = "../lib/crates/event_store" }
radroots_event = { path = "../lib/crates/event" }
radroots_event_codec = { path = "../lib/crates/event_codec" }
radroots_event_index = { path = "../lib/crates/event_index" }
radroots_geocoder = { path = "../lib/crates/geocoder" }
radroots_identity = { path = "../lib/crates/identity" }
radroots_nostr = { path = "../lib/crates/nostr" }
radroots_nostr_connect = { path = "../lib/crates/nostr_connect" }
radroots_nostr_signer = { path = "../lib/crates/nostr_signer" }
radroots_outbox = { path = "../lib/crates/outbox" }
radroots_protocol = { path = "../lib/crates/protocol" }
radroots_protocol_contract_v1 = { path = "../lib/crates/protocol_contract_v1" }
radroots_protected_store = { path = "../lib/crates/protected_store" }
radroots_secret_vault = { path = "../lib/crates/secret_vault" }
