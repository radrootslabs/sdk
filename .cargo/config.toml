radroots_replica_store = { path = "../lib/crates/replica_store" }
radroots_replica_schema = { path = "../lib/crates/replica_schema" }
radroots_replica_sync = { path = "../lib/crates/replica_sync" }
radroots_runtime_paths = { path = "../lib/crates/runtime_paths" }
radroots_sql_core = { path = "../lib/crates/sql_core" }
radroots_trade = { path = "../lib/crates/trade" }
